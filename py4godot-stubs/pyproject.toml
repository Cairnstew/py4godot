[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "py4godot-stubs"
version = "4.7.0"
description = "Type stubs for py4godot"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["py4godot"]

[tool.setuptools.packages.find]
include = ["py4godot*"]

[tool.setuptools.package-data]
py4godot = ["*.pyi"]
